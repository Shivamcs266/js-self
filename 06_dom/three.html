<script>
    const div = document.createElement('div')
    console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random() * 10 + 1)  //Library: Math.random= for provide any randomly number., Math.round: provide a one value.
    div.setAttribute("title", "genrated title") //for set 
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // div.innerText = "Shivam Sharma"
    const addText = document.createTextNode("Shivam Learing DOM")
    div.appendChild(addText)   // append means add the new element.

    document.body.appendChild(div)

</script>
